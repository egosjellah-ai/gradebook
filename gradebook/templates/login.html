<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Simple Gradebook</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #0f172a; background-image: radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%); height: 100vh; display: flex; justify-content: center; align-items: center; color: #fff; }
        .login-box { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); padding: 50px 40px; border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); width: 420px; text-align: center; }
        .logo-icon { width: 60px; height: 60px; background: linear-gradient(135deg, #6366f1, #a855f7); border-radius: 16px; display: flex; justify-content: center; align-items: center; margin: 0 auto 20px auto; font-size: 30px; box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.5); }
        .login-box h2 { font-size: 26px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.5px; }
        .login-box p { color: #94a3b8; font-size: 14px; margin-bottom: 35px; }
        .input-group { text-align: left; margin-bottom: 20px; }
        .input-group label { display: block; font-size: 13px; font-weight: 500; color: #cbd5e1; margin-bottom: 8px; }
        .input-group input { width: 100%; padding: 14px; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; color: #fff; font-size: 14px; outline: none; transition: 0.3s; }
        .input-group input:focus { border-color: #6366f1; background: rgba(15, 23, 42, 0.9); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2); }
        .login-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #6366f1, #8b5cf6); border: none; border-radius: 12px; color: white; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .login-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4); }
    </style>
</head>
<body>
    <div class="login-box">
        <!-- ERROR MESSAGE DISPLAY -->
        {% if messages %}
            {% for message in messages %}
                <div style="background: #ef4444; color: white; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; font-weight: 600;">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <div class="logo-icon">📘</div>
        <h2>Welcome Back</h2>
        <p>Log in to your Gradebook account</p>

        <form method="POST" action="">
            {% csrf_token %}
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="name@school.edu" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="login-btn">Sign In</button>
        </form>
    </div>
</body>
</html>
